# Secrets for Streamlit Community Cloud. Copy to cloud-secrets.toml (gitignored), fill in,
# then paste its contents into the app's Advanced settings → Secrets.
# Top-level keys become environment variables, so config.py reads them like .env.

# Neon: use the *direct* connection string (host without "-pooler").
DATABASE_URL = "postgresql://USER:PASSWORD@ep-XXXX.REGION.aws.neon.tech/neondb?sslmode=require"

ANTHROPIC_API_KEY = "sk-ant-..."
OPENAI_API_KEY = "sk-..."          # embeddings for the ECF manual search
LC_MODEL = "anthropic:claude-sonnet-5-5"
LC_EFFORT = "low"                  # low | medium | high | xhigh | max (Anthropic models only)
LC_EMBEDDING_MODEL = "text-embedding-3-small"

# Usage limits (optional; these are the defaults).
LC_DAILY_MESSAGE_LIMIT = "20"      # messages per user per day (São Paulo time)
LC_MONTHLY_BUDGET_USD = "20"       # whole app; above it everyone sees "volte mais tarde"
LC_PRICE_INPUT_PER_MTOK = "2"      # USD per million tokens for LC_MODEL (claude-sonnet-5-5)
LC_PRICE_OUTPUT_PER_MTOK = "10"

# Password-reset emails ("Esqueceu a senha?" only appears when SMTP_HOST is set).
# Gmail: smtp.gmail.com, port 587, your address, and an App Password (not your normal password).
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"                  # 587 = STARTTLS, 465 = implicit TLS
SMTP_USERNAME = "you@gmail.com"
SMTP_PASSWORD = "app-password"
SMTP_FROM = "Prumo Fiscal <you@gmail.com>"
APP_URL = "https://lc-demo.streamlit.app"   # reset links point here
